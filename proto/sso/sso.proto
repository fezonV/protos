// proto/sso/sso.proto

// Версия ProtoBuf
syntax = "proto3";

// текущий пакет - указывает пространство имен для сервиса и сообщений. Помогает избегать конфликт имен
package auth;

// настройка для генерации go-кода

option go_package = "fezonV.sso.v1;ssov1";

// Auth - сервис для менеджмента разрешений и ролей

service Auth {
    // Register регистрирует нового пользователя
    rpc Register (RegisterRequest) returns (RegisterResponse);

    // Login производит вход пользователя и возвращает токен аутентификации
    rpc Login (LoginRequest) returns (LoginResponse);

} 
 
// Todo: на будущее, следующий сервис можно описать прямо здесь, либо вынести в отдельный файл 
// service Permissions {
//      GetUserPermissions(GetUserPermissionRequest) return UserPermissions    
// }

// Объект колторый отправляется при вызове RPC-метода (ручки) Register.
message RegisterRequest {
    string email = 1; // email пользователя для регистрации
    string password = 2; // пароль пользователя для регистрации
}

// Объект, который эта ручка и вернет
message RegisterResponse {
    int64 user_id = 1; // ID зарегистрированного пользователя
}

// То же самое для метода Login()

message LoginRequest {
    string email = 1;
    string password = 2;
    
    int32 app_id = 3; // Id приложения, в которое должен быть осуществлен вход
}

message LoginResponse {
    string token = 1; // Логин аутентификации вошедшего пользователя
}